name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  vtk:
    # The reader's file code, the reader as a plain VTK algorithm, the web
    # viewer and the launcher, with the vtk wheel from pip.
    name: pip vtk (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install OpenGL for headless rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libosmesa6
      - name: Install Mesa for headless rendering
        # Windows runners have only OpenGL 1.1.  Mesa's software opengl32.dll
        # (llvmpipe), next to python.exe, gives VTK a full OpenGL, as it would
        # on a Windows server without a GPU.  (Mesa no longer ships OSMesa,
        # the other fallback VTK looks for.)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfLo mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          7z x -omesa mesa.7z > /dev/null
          cp mesa/x64/*.dll "$pythonLocation"
          echo GALLIUM_DRIVER=llvmpipe >> "$GITHUB_ENV"
      - run: pip install -e ".[web,test]"
      - run: python -m pytest -v

  paraview:
    # Everything above with ParaView's VTK, plus the reader inside ParaView.
    name: ParaView (conda-forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL for headless rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libosmesa6
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: paraview
          channels: conda-forge
      # vtk-base 9.7.0 build py314h5f6b05c_1 (2026-10-21) links the external
      # cgns, but ParaView 6.2 was built against the earlier build and still
      # needs VTK's own libvtkcgns-9.7.so.1.  Pin the earlier build until
      # conda-forge rebuilds ParaView, then drop the python and vtk-base pins.
      - run: conda install -y paraview netcdf4 pytest python=3.14 "vtk-base=9.7.0=py314h1d44257_1"
      - run: pip install -e . --no-deps
      - run: python -c "import paraview.simple; print(paraview.simple.GetParaViewVersion())"
      - run: python -m pytest -v
